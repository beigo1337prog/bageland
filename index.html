<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Bageland</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="TemplateData/style.css">
  <style>
@font-face { font-family: 'GridworksPixel'; src: url('GridworksPixel.ttf') format('truetype'); }
html, body { margin: 0; height: 100%; overflow: hidden; background: #1E2228; }
#unity-container, #unity-container.unity-desktop { position: fixed; left: 0; top: 0; width: 100%; height: 100%; transform: none; }
#unity-canvas { width: 100% !important; height: 100% !important; background: #1E2228; }
#unity-footer { display: none; }
</style>
</head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Bageland</div>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/5816c9c178a0b7202d91dfa04856b781.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/697a4f343cf771b2f6b919a183d80358.data.unityweb",
        frameworkUrl: buildUrl + "/8fe4186bdd0d72b41febae266cbbd1b3.framework.js.unityweb",
        codeUrl: buildUrl + "/d5b0ae44a0d8d330a12e1ab00b4b7c1d.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Bageland",
        productVersion: "1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      // config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        // config.devicePixelRatio = 1;


      } else {
        // Desktop style: Render the game canvas in a window that can be maximized to fullscreen:
        canvas.style.width = "960px";
        canvas.style.height = "600px";
      }

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        try { if (localStorage.getItem('gwLowRes') === '1') config.devicePixelRatio = 1; } catch (e) {}
        createUnityInstance(canvas, config, (progress) => {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
              }).then((unityInstance) => { window.gwUnity = unityInstance;
                document.querySelector("#unity-loading-bar").style.display = "none";
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      document.body.appendChild(script);

    </script>
  <script>
(function () {
  var build = '20261121180627', version = 77, dismissed = null;
  // Bug-fix releases raise version.json's min: older pages can't keep playing.
  function forceUpdate() {
    if (document.getElementById('gw-force')) return;
    var o = document.createElement('div');
    o.id = 'gw-force';
    o.style.cssText = 'position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;' +
      'background:rgba(14,17,21,.94);color:#E6EAF0;font:22px GridworksPixel,sans-serif;text-align:center';
    var h = document.createElement('div');
    h.textContent = 'Update to play';
    h.style.cssText = 'font-size:56px;color:#F2C14E';
    var b = document.createElement('div');
    b.id = 'gw-update-text';
    b.textContent = 'Update';
    b.style.cssText = 'padding:14px 40px;background:#58C46E;color:#10161C;border-radius:8px;cursor:pointer;font-size:28px';
    b.onclick = saveAndReload;
    o.appendChild(h);
    o.appendChild(b);
    document.body.appendChild(o);
    var old = document.getElementById('gw-update');
    if (old) old.remove();
  }
  window.gwForceUpdate = forceUpdate;
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('gw-force') && e.key === 'Enter') saveAndReload();
  });
  function check() {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (v) {
        if (v.min && v.min > version) { forceUpdate(); return; }
        if (!v.build || v.build === build || v.build === dismissed || document.getElementById('gw-update')) return;
        var b = document.createElement('div');
        b.id = 'gw-update';
        b.style.cssText = 'position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:10;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:14px;' +
          'background:#58C46E;color:#10161C;font:20px GridworksPixel,sans-serif;border-radius:8px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.5)';
        var t = document.createElement('span');
        t.id = 'gw-update-text';
        t.textContent = 'New update! Refresh the page (or click here) to get it';
        var x = document.createElement('span');
        x.id = 'gw-update-close';
        x.textContent = 'X';
        x.title = 'Dismiss';
        x.style.cssText = 'padding:2px 9px;border-radius:6px;background:rgba(16,22,28,.18)';
        x.onclick = function (e) { e.stopPropagation(); dismissed = v.build; b.remove(); };
        b.appendChild(t);
        b.appendChild(x);
        b.onclick = saveAndReload;
        document.body.appendChild(b);
      })
      .catch(function () { });
  }
  // Ask the game to save, wait for browser storage to finish writing (or give up after a few seconds), then reload.
  function saveAndReload() {
    var b = document.getElementById('gw-update-text');
    if (b) b.textContent = 'Saving...';
    var before = window.gwSyncs || 0, waited = 0;
    try { if (window.gwUnity) window.gwUnity.SendMessage('Session', 'SaveForUpdate'); } catch (e) { }
    (function wait() {
      if ((window.gwSyncs || 0) > before || waited >= 3000) { location.reload(); return; }
      waited += 100;
      setTimeout(wait, 100);
    })();
  }
  setInterval(check, 30000);
  setTimeout(check, 5000);
})();
</script>
<script>
(function () {
  var build = '20261121180627', notes = '<h3>v0.77: Nuclear power</h3><ul><li><b>Pressurised Reactor</b> (11&#215;11, research <b>Nuclear Power</b>): a 7&#215;7 core of Low-Enrichment Fuel Rods and control rods in 4 groups. Its hot Primary Coolant goes to <b>Steam Generators</b> (12 MW each) and comes back cooled; their steam turns Large Steam Turbines.</li><li><b>Control room</b> (Enter on the reactor): core map, heat and rod temperatures, graphs, rod groups, rod speed, pump and <b>SCRAM</b> (End).</li><li>Refuel with the <b>lid</b> (U): it opens only with every rod in and cool. Spent rods go to the <b>Spent Fuel Pool</b>.</li><li>Rods over 700 &#176;C are damaged; at 1,200 &#176;C the core melts down, destroying everything within 6 tiles and the turbines it feeds. The wreck pollutes and blocks building around it until 5,000 concrete seals it.</li><li>Primary Coolant and spent rods are radioactive: tanks, storage, sellers and dumps refuse them.</li></ul>', key = 'gw-seen-build';
  var seen = null;
  try { seen = localStorage.getItem(key); } catch (e) { }
  if (!notes || seen === build) return;
  function remember() { try { localStorage.setItem(key, build); } catch (e) { } }
  var shade = document.createElement('div');
  shade.id = 'gw-whatsnew';
  shade.style.cssText = 'position:fixed;inset:0;z-index:20;background:rgba(10,12,16,.6);display:flex;align-items:center;justify-content:center';
  var box = document.createElement('div');
  box.style.cssText = 'max-width:460px;width:calc(100% - 32px);max-height:80vh;overflow:auto;background:#232A33;color:#E6EAF0;' +
    'font:20px/1.3 GridworksPixel,sans-serif;border:2px solid #F2A838;border-radius:10px;padding:18px 22px;box-shadow:0 8px 32px rgba(0,0,0,.6)';
  box.innerHTML = '<div style="font:20px GridworksPixel,sans-serif;letter-spacing:.08em;color:#F2A838;margin-bottom:4px">WHAT\'S NEW</div>' + notes +
    '<button id="gw-whatsnew-ok" style="margin-top:12px;padding:8px 22px;font:20px GridworksPixel,sans-serif;background:#F2A838;color:#10161C;' +
    'border:0;border-radius:6px;cursor:pointer">OK</button>';
  shade.appendChild(box);
  function close() { remember(); shade.remove(); var c = document.getElementById('unity-canvas'); if (c) c.focus(); }
  shade.addEventListener('click', function (e) { if (e.target === shade) close(); });
  document.body.appendChild(shade);
  document.getElementById('gw-whatsnew-ok').onclick = close;
  var st = document.createElement('style');
  st.textContent = '#gw-whatsnew h3{margin:0 0 8px;font-size:30px;font-weight:normal}#gw-whatsnew b{font-weight:normal;color:#F2A838}#gw-whatsnew ul{margin:6px 0;padding-left:20px}#gw-whatsnew li{margin:3px 0}#gw-whatsnew p{margin:6px 0}';
  document.head.appendChild(st);
})();
</script>
</body>
</html>
