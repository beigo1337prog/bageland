    <script>

            };

      if (!window.gwIntroHere) gwStartUnity();

<script>
(function () {
  if (!window.gwIntroHere) {
    ['gw-intro', 'gw-load', 'gw-play'].forEach(function (id) { var el = document.getElementById(id); if (el) el.remove(); });
    window.gwAfterIntro = function (fn) { fn(); };
    return;
  }
  var f = document.getElementById('gw-intro'), t0 = performance.now(), ready = false, gone = false, offered = false, waiting = [];
  var bar = document.getElementById('gw-load'), fill = bar.querySelector('.fill'), pct = bar.querySelector('.pct');
  var play = document.getElementById('gw-play');
  function setBar(p) { p = Math.max(0, Math.min(1, p)); fill.style.width = (100 * p).toFixed(1) + '%'; pct.textContent = Math.round(100 * p) + '%'; }
  // Download share of the bar; the rest is the game starting up.
  var DL = 0.85;
  window.gwIntroProgress = function (p) { if (!ready) setBar(DL + (1 - DL) * p); };
  function dropBar() { if (!bar.parentNode) return; bar.style.opacity = '0'; setTimeout(function () { bar.remove(); }, 800); }
  window.gwAfterIntro = function (fn) { if (gone) fn(); else waiting.push(fn); };
  function hide() {
    if (gone) return; gone = true;
    try { localStorage.setItem('gwIntroSeen', '1'); } catch (e) { }
    try { f.contentWindow.BagelandIntro.fadeOut(1.4); } catch (e) { try { f.contentWindow.BagelandIntro.mute(true); } catch (e2) { } }
    f.style.opacity = '0'; f.style.pointerEvents = 'none'; dropBar();
    play.className = 'off';
    setTimeout(function () { f.remove(); play.remove(); }, 1600);
    var c = document.getElementById('unity-canvas'); if (c) c.focus();
    waiting.forEach(function (fn) { fn(); }); waiting = [];
  }
  function offer() { if (offered || gone) return; offered = true; play.className = 'on'; try { play.focus({ preventScroll: true }); } catch (e) { } }
  play.addEventListener('click', hide);
  function key(e) {
    var b = null; try { b = f.contentWindow.BagelandIntro; } catch (x) { }
    if (b && b.held && b.held()) { e.preventDefault(); b.start(); return; }   // the start screen: any key
    if (!ready || gone) return;
    var k = e.key;
    if (k === 'Escape' || k === 'Esc' || (offered && (k === 'Enter' || k === ' ' || k === 'Spacebar'))) { e.preventDefault(); hide(); }
  }
  window.gwIntroReady = function () {
    ready = true;
    (window.gwIntroFiles || []).forEach(function (u) { try { URL.revokeObjectURL(u); } catch (e) { } });
    setBar(1); setTimeout(dropBar, 450);
    var id = setInterval(function () {
      var t = null;
      try { t = f.contentWindow.BagelandIntro.time(); } catch (e) { }
      if (typeof t !== 'number') t = (performance.now() - t0) / 1000;
      if (gone || t >= 10.5) { clearInterval(id); offer(); }
    }, 100);
  };
  addEventListener('keydown', key);
  f.addEventListener('load', function () { try { f.contentWindow.addEventListener('keydown', key); } catch (e) { } });
  f.addEventListener('error', function () { start(); hide(); });

  // The game's files download straight away (into memory: the loader's own requests skip the browser cache), but the
  // game is only started, which takes the page's whole attention for a few seconds, once the logo has landed: the
  // intro plays smoothly first. A slow download starts it as soon as the files are in.
  var started = false, fetched = false;
  function start() { if (started) return; started = true; if (window.gwStartUnity) gwStartUnity(); }
  // The intro's clock stays at 0 on its start screen, so the game waits for the logo after the click.
  function introTime() {
    try { var t = f.contentWindow.BagelandIntro.time(); if (typeof t === 'number') return t; } catch (e) { }
    return (performance.now() - t0) / 1000;
  }
  var gate = setInterval(function () {
    if (started) { clearInterval(gate); return; }
    var t = introTime();
    if ((fetched && t >= 10.6) || t > 30) { clearInterval(gate); start(); }
  }, 100);
  (function prefetch() {
    var cfg = window.config;
    if (!cfg || !window.fetch || !window.URL || !URL.createObjectURL) { fetched = true; return; }
    var keys = ['dataUrl', 'frameworkUrl', 'codeUrl'].filter(function (k) { return cfg[k]; });
    var got = {}, total = 10277276, urls = [];
    function shown() { var n = 0; for (var k in got) n += got[k]; setBar(DL * Math.min(1, n / Math.max(1, total))); }
    Promise.all(keys.map(function (k) {
      return fetch(cfg[k]).then(function (r) {
        if (!r.ok) throw new Error(r.status);

        if (!r.body || !r.body.getReader) return r.blob();
        var reader = r.body.getReader(), parts = [];

          return reader.read().then(function (c) {

            return pump();
          });
        }
        return pump();
      }).then(function (blob) { return [k, blob]; });
    })).then(function (list) {
      list.forEach(function (kv) { var u = URL.createObjectURL(kv[1]); urls.push(u); cfg[kv[0]] = u; });
      window.gwIntroFiles = urls;
      fetched = true;
    }).catch(function () { fetched = true; start(); });   // fall back to the loader's own downloads
  })();
})();

<script>
(function () {
  var build = '20261128071012', version = 94, dismissed = null;
  // Bug-fix releases raise version.json's min: older pages can't keep playing.
  function forceUpdate() {
    if (document.getElementById('gw-force')) return;
    var o = document.createElement('div');
    o.id = 'gw-force';
    o.style.cssText = 'position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;' +
      'background:rgba(14,17,21,.94);color:#E6EAF0;font:22px GridworksPixel,sans-serif;text-align:center';
    var h = document.createElement('div');
    h.textContent = 'Update to play';
    h.style.cssText = 'font-size:56px;color:#F2C14E';
    var b = document.createElement('div');
    b.id = 'gw-update-text';
    b.textContent = 'Update';
    b.style.cssText = 'padding:14px 40px;background:#58C46E;color:#10161C;border-radius:8px;cursor:pointer;font-size:28px';
    b.onclick = saveAndReload;
    o.appendChild(h);
    o.appendChild(b);
    document.body.appendChild(o);
    var old = document.getElementById('gw-update');
    if (old) old.remove();
  }
  window.gwForceUpdate = forceUpdate;
  document.addEventListener('keydown', function (e) {
    if (document.getElementById('gw-force') && e.key === 'Enter') saveAndReload();
  });
  function check() {
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (v) {
        if (v.min && v.min > version) { forceUpdate(); return; }
        if (!v.build || v.build === build || v.build === dismissed || document.getElementById('gw-update')) return;
        var b = document.createElement('div');
        b.id = 'gw-update';
        b.style.cssText = 'position:fixed;top:76px;left:50%;transform:translateX(-50%);z-index:10;padding:10px 12px 10px 20px;display:flex;align-items:center;gap:14px;' +
          'background:#58C46E;color:#10161C;font:20px GridworksPixel,sans-serif;border-radius:8px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.5)';
        var t = document.createElement('span');
        t.id = 'gw-update-text';
        t.textContent = 'New update! Refresh the page (or click here) to get it';
        var x = document.createElement('span');
        x.id = 'gw-update-close';
        x.textContent = 'X';
        x.title = 'Dismiss';
        x.style.cssText = 'padding:2px 9px;border-radius:6px;background:rgba(16,22,28,.18)';
        x.onclick = function (e) { e.stopPropagation(); dismissed = v.build; b.remove(); };
        b.appendChild(t);
        b.appendChild(x);
        b.onclick = saveAndReload;
        document.body.appendChild(b);
      })
      .catch(function () { });
  }
  // Ask the game to save, wait for browser storage to finish writing (or give up after a few seconds), then reload.
  function saveAndReload() {
    var b = document.getElementById('gw-update-text');
    if (b) b.textContent = 'Saving...';
    var before = window.gwSyncs || 0, waited = 0;
    try { if (window.gwUnity) window.gwUnity.SendMessage('Session', 'SaveForUpdate'); } catch (e) { }
    (function wait() {
      if ((window.gwSyncs || 0) > before || waited >= 3000) { location.reload(); return; }
      waited += 100;
      setTimeout(wait, 100);
    })();
  }
  setInterval(check, 30000);
  setTimeout(check, 5000);
})();
</script>
