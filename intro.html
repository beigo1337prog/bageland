<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bageland</title>
<style>
html,body{margin:0;height:100%;background:#0E0F13;overflow:hidden}
canvas{position:fixed;left:0;top:0;width:100%;height:100%;display:block}
#bl-logo{image-rendering:crisp-edges;image-rendering:pixelated;pointer-events:none}
#bl-hint{position:fixed;right:14px;top:12px;font:11px/1 ui-monospace,Consolas,Menlo,monospace;letter-spacing:.12em;
  text-transform:uppercase;color:#9EA3AD;opacity:.7;transition:opacity .6s;pointer-events:none}
@font-face{font-family:'GridworksPixel';src:url('GridworksPixel.ttf') format('truetype')}
#bl-start{position:fixed;left:0;top:0;width:100%;height:100%;z-index:3;display:none;flex-direction:column;align-items:center;
  justify-content:center;gap:9vh;cursor:pointer;transition:opacity .6s ease-out;-webkit-tap-highlight-color:transparent;
  background:radial-gradient(ellipse 55% 40% at 50% 42%,rgba(245,169,58,.17),rgba(245,169,58,.05) 45%,rgba(245,169,58,0) 75%),#0E0F13}
#bl-start.on{display:flex}
#bl-start.gone{opacity:0;pointer-events:none}
#bl-start img{width:min(80vw,884px);image-rendering:crisp-edges;image-rendering:pixelated;animation:bl-rise 1s ease-out both;
  filter:drop-shadow(0 0 28px rgba(245,169,58,.32)) drop-shadow(0 6px 0 rgba(0,0,0,.45))}
#bl-start .go{padding:12px 44px 16px;font:clamp(18px,3.6vw,28px) GridworksPixel,monospace;letter-spacing:.12em;color:#1C1009;
  background:#F5A93A;border:3px solid #1C1009;border-radius:4px;animation:bl-in .8s .35s ease-out both,bl-pulse 2s 1.2s ease-in-out infinite;
  box-shadow:inset 0 3px 0 #FFE08A,inset 0 -6px 0 #C0631C,0 4px 0 #1C1009,0 10px 30px rgba(0,0,0,.55)}
#bl-start:hover .go{background:#FFB648;outline:2px solid #FFE08A;outline-offset:3px}
@keyframes bl-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes bl-in{from{opacity:0}to{opacity:1}}
@keyframes bl-pulse{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.045);filter:brightness(1.12)}}
</style>
</head>

  I.bell=(t,n,vol,dec=1.4,pan=0)=>{const f=mtof(n),vv=vol*(1+.1*hum());
    [[1,1,dec*.7],[3.99,.22,dec*.12],[9.9,.05,dec*.05]].forEach(p=>{if(f*p[0]>15000)return;const e=perc(t,.002,vv*p[1],p[2]),o=osc('sine',f*p[0],t,p[2]+.1);o.connect(e);out(e,.35,pan)});
    const nn=noise(t,.03),bp=filt('bandpass',min(9000,f*2),1.5),ke=perc(t,.001,vv*.25,.015);nn.connect(bp);bp.connect(ke);out(ke,.1,pan)};
  // the old bell (sine partials of a struck bar), kept for the lights coming on pole to pole
  I.chime=(t,n,vol,dec=1.4,pan=0)=>{const f=mtof(n);
    [[1,1,dec],[2.76,.36,dec*.55],[5.4,.16,dec*.3],[8.93,.07,dec*.18]].forEach(p=>{if(f*p[0]>15000)return;const e=perc(t,.003,vol*p[1],p[2]),o=osc('sine',f*p[0],t,p[2]+.1);o.connect(e);out(e,.6,pan)})};
  I.bass=(t,n,dur,vol)=>{const lp=filt('lowpass',480,.6);playString(t,n,'bass',vol*.7*(1+.08*hum()),dur).connect(lp);out(lp,.06)};
  I.kick=(t,vol)=>{const vv=vol*(1+.08*hum()),o=ac.createOscillator(),e=perc(t,.002,vv,.2);o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(48,t+.08);
    o.start(t);o.stop(t+.3);o.connect(e);out(e,.04);
    const nn=noise(t,.02),lp=filt('lowpass',2600,.7),ce=perc(t,.001,vv*.35,.008);nn.connect(lp);lp.connect(ce);out(ce,.02)};
  // hi-hat: six square waves at inharmonic ratios, like a real cymbal's metal
  function metal(t,vol,dec,hp,pan,send){const g=ac.createGain();g.gain.value=1/6;
    [2,3,4.16,5.43,6.79,8.21].forEach(r=>osc('square',40*r*7.9,t,dec+.05).connect(g));
    const h=filt('highpass',hp,.7),b=filt('bandpass',hp*1.35,.6),e=perc(t,.001,vol,dec);g.connect(h);h.connect(b);b.connect(e);out(e,send,pan)}
  I.tick=(t,vol,pan=0)=>metal(t,vol*5*(1+.2*hum()),.035,7200,pan,.08);
  I.snare=(t,vol)=>{const vv=vol*2*(1+.1*hum()),n=noise(t,.2),hp=filt('highpass',900,.7),bp=filt('bandpass',2600,.5),e=perc(t,.001,vv,.15);n.connect(hp);hp.connect(bp);bp.connect(e);out(e,.25);
    [[180,.55],[330,.3]].forEach(p=>{const o=osc('triangle',p[0],t,.12),oe=perc(t,.001,vv*p[1],.06);o.connect(oe);out(oe,.08)})};
  I.clank=(t,n,vol,pan=0)=>{const f=mtof(n);
    [[1,.8,.3],[1.5,.35,.2],[2.76,.5,.16],[4.07,.3,.1],[5.4,.2,.07]].forEach(p=>{const e=perc(t,.001,vol*p[1],p[2]),o=osc(p[0]<2?'triangle':'square',f*p[0],t,p[2]+.05);
      const bp=filt('bandpass',f*p[0],4);o.connect(bp);bp.connect(e);out(e,.3,pan)});
    const nn=noise(t,.08),bp=filt('bandpass',3200,1),e=perc(t,.001,vol*.5,.045);nn.connect(bp);bp.connect(e);out(e,.2,pan);
    const o=ac.createOscillator(),oe=perc(t,.001,vol*.9,.12);o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(60,t+.09);o.start(t);o.stop(t+.2);o.connect(oe);out(oe,.05,pan)};
  // a steam valve letting go (it builds the same way the old riser did, without the sweep)
  I.whoosh=(t,rise,tail,vol,f0=260,f1=2800)=>{const n=noise(t-rise,rise+tail+.1),hp=filt('highpass',2500,.7),bp=filt('bandpass',min(7000,f1*1.6),.8),e=ac.createGain();
    e.gain.setValueAtTime(.0001,t-rise);e.gain.exponentialRampToValueAtTime(vol*.55,t);e.gain.exponentialRampToValueAtTime(.0001,t+tail);n.connect(hp);hp.connect(bp);bp.connect(e);out(e,.2,.3)};
  // floor tom instead of a cinematic boom
  I.boom=(t,vol)=>{const o=ac.createOscillator(),e=perc(t,.003,vol*.6,.4);o.frequency.setValueAtTime(98,t);o.frequency.exponentialRampToValueAtTime(72,t+.3);o.start(t);o.stop(t+.7);o.connect(e);out(e,.2);
    const nn=noise(t,.06),lp=filt('lowpass',500,.8),ne=perc(t,.001,vol*.5,.05);nn.connect(lp);lp.connect(ne);out(ne,.15)};
  I.whirr=(t,dur,vol)=>{const o=ac.createOscillator(),lp=filt('lowpass',520,2),e=ac.createGain(),l=osc('sine',27,t,dur+.1),lg_=ac.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(48,t);o.frequency.exponentialRampToValueAtTime(118,t+dur);o.start(t);o.stop(t+dur+.1);
    e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(vol,t+dur*.85);e.gain.linearRampToValueAtTime(.0001,t+dur+.06);
    lg_.gain.value=vol*.35;l.connect(lg_);lg_.connect(e.gain);o.connect(lp);lp.connect(e);out(e,.2)};
  I.sizzle=(t,dur,vol)=>{const n=noise(t,dur+.1),hp=filt('bandpass',4800,.6),e=ac.createGain();e.gain.setValueAtTime(.0001,t);e.gain.linearRampToValueAtTime(vol,t+.12);
    e.gain.setValueAtTime(vol,t+dur*.8);e.gain.linearRampToValueAtTime(.0001,t+dur);n.connect(hp);hp.connect(e);out(e,.2,.25)};
  I.crash=(t,vol,dec=1.8)=>metal(t,vol*2.4,dec*.8,5200,0,.3);
  return I}

const CH={D:[50,57,62,66],Dadd9:[50,57,64,66],Ac:[52,57,61,64],Bm:[54,59,62,66],G:[55,59,62,67],Df:[57,62,66,69],Em:[55,59,62,64],As:[57,62,64,69],A:[57,61,64,69]};
/* the 12 s intro. `from` skips events already in the past (when sound is switched on late). */
function scoreIntro(I,t0,from){
  const at=(t,fn)=>{if(t>=from)fn(t0+t)};
  // bar 1: dawn. a warm pad, the drill winds up and bites on beat 3
  at(0,t=>I.pad(t,2.1,CH.Dadd9,.26,900,1.1,.9));
  at(.5,t=>I.whirr(t,.5,.12));
  at(1,t=>{I.clank(t,50,.34,-.3);I.kick(t,.42)});
  at(1,t=>I.pluck(t,66,.2,-.2));at(1.5,t=>I.pluck(t,69,.22,.2));
  // conveyor ticks (8ths) and the drill's thud on every beat
  for(let i=0;i<36;i++){const tt=1+i*.25,v=tt<2?.05:tt<6?.085:.1;at(tt,t=>I.tick(t,i%2?v*.6:v,i%2?.25:-.25))}
  for(let b=3;b<20;b++)at(b*.5,t=>I.kick(t,b<8?.34:.46));
  // bar 2: chunks ride the belt
  at(2,t=>{I.pad(t,2.1,CH.Ac,.27,1100,.4,.8);I.bass(t,45,1.9,.2)});
  [64,69,73,69,64,69,76,73].forEach((n,i)=>at(2+i*.25,t=>I.pluck(t,n,.2,i%2?.3:-.3)));
  at(4,t=>{I.whoosh(t,.55,1.3,.3);I.boom(t,.5)});
  // bar 3: furnace lights, metal pours
  at(4,t=>{I.pad(t,1.05,CH.Bm,.29,1300,.25,.7);I.bass(t,35,.95,.3)});
  at(5,t=>{I.pad(t,1.05,CH.G,.3,1500,.25,.7);I.bass(t,43,.95,.3);I.sizzle(t,.9,.045)});
  [66,71,74,71,67,71,74,79].forEach((n,i)=>at(4+i*.25,t=>I.pluck(t,n,.22,i%2?.3:-.3)));
  at(4.5,t=>I.snare(t,.12));at(5.5,t=>I.snare(t,.14));
  // bar 4: the ingot, then the machines join one beat at a time
  at(6,t=>{I.bell(t,81,.2,1.6,.2);I.bell(t,86,.17,1.8,-.1);I.crash(t,.05,1);I.pad(t,1.05,CH.Df,.3,1700,.2,.7);I.bass(t,42,.95,.32)});
  at(7,t=>{I.pad(t,1.05,CH.G,.3,1800,.2,.7);I.bass(t,43,.95,.32)});
  [69,74,78,74,67,71,74,79].forEach((n,i)=>at(6+i*.25,t=>I.pluck(t,n,.22,i%2?.3:-.3)));
  [62,64,66,69,71].forEach((n,i)=>at(MT[i],t=>I.clank(t,n,.3,(i-2)*.25)));
  at(6.5,t=>I.snare(t,.15));at(7.5,t=>I.snare(t,.16));
  for(let i=0;i<20;i++)at(7.5+i*.125,t=>I.tick(t,.035+.0015*i,(i%4-1.5)*.25));
  // bar 5: lift into the final chord; power runs pole to pole
  at(8,t=>{I.pad(t,1.05,CH.Em,.31,2000,.2,.7);I.bass(t,40,.95,.33)});
  at(9,t=>{I.pad(t,1,CH.As,.32,2400,.2,.5);I.bass(t,45,.95,.34);I.whoosh(t+1,1,.5,.16,500,5200)});
  [67,71,76,71].forEach((n,i)=>at(8+i*.25,t=>I.pluck(t,n,.22,i%2?.3:-.3)));
  [71,76,79,83].forEach((n,i)=>at(8+i*.25,t=>I.pluck(t,n,.1,i%2?-.3:.3)));
  at(8.5,t=>I.snare(t,.16));at(9.5,t=>I.snare(t,.17));
  [69,73,76,81].forEach((n,i)=>at(PT[i],t=>{I.chime(t,n,.24,.9,-.45+i*.3);I.tick(t,.1)}));
  for(let i=0;i<4;i++)at(9.5+i*.125,t=>I.snare(t,.05+.03*i));
  // bar 6: the logo lands on D
  at(10,t=>{I.pad(t,1.5,[38,50,57,62,66,69,74],.3,3200,.03,1.6);I.bass(t,38,2.2,.4);I.boom(t,.55);I.kick(t,.6);I.crash(t,.1,2.2);I.clank(t,62,.22)});
  [78,81,86].forEach((n,i)=>at(10+i*.06,t=>I.bell(t,n,.17,2.2,(i-1)*.4)));
  at(10,t=>I.pluck(t,74,.25));
  [86,90,93,98].forEach((n,i)=>at(10.52+i*.07,t=>I.bell(t,n,.05,.7,-.4+i*.27)));
  at(11,t=>I.kick(t,.2));
  for(let i=0;i<8;i++)at(10+i*.25,t=>I.tick(t,.06*(1-i/11),i%2?.25:-.25))}
/* the quiet loop: one bar = 2 s, chords D | Bm | G | A */
function scoreBar(I,t0,n,from){
  const T=12+2*n,at=(t,fn)=>{if(T+t>=from)fn(t0+T+t)},c=[CH.Dadd9,CH.Bm,CH.G,CH.A][n%4],b=[38,35,43,45][n%4];
  at(0,t=>{I.pad(t,2.05,c,.1,1000,.6,.9);I.bass(t,b,1.9,.11);I.kick(t,.1);I.bell(t,[81,78,74,76][n%4],.07,1.6,n%2?.3:-.3)});
  for(let i=0;i<8;i++)at(i*.25,t=>I.tick(t,i%2?.014:.024,i%2?.25:-.25));
  at(1,t=>I.kick(t,.07));
  [c[2]+12,c[3]+12,c[1]+12].forEach((m,i)=>at(.5+i*.5,t=>I.pluck(t,m,.07,i%2?.3:-.3)))}

/* ---------- live playback ---------- */
let ac=null,syn=null,aT0=0,pT0=performance.now()/1000,muted=false,nextBar=0,sched=0,unlocked=false;
function now(){
  if(held){pT0=performance.now()/1000;return 0}
  if(ac&&ac.state==='running'&&syn){const t=ac.currentTime-aT0-(ac.outputLatency||ac.baseLatency||0);pT0=performance.now()/1000-t;return t}
  return performance.now()/1000-pT0}
function pump(){if(!ac||!syn)return;const t=ac.currentTime-aT0;while(12+2*nextBar<t+3){scoreBar(syn,aT0,nextBar,t+.02);nextBar++}}
function startAudio(restart){
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  if(ac){try{ac.close()}catch(e){}}clearInterval(sched);syn=null;
  ac=new AC();const a=ac;
  (a.resume?a.resume():Promise.resolve()).then(()=>{
    if(a!==ac)return;
    const t=restart?-.15:now(),I=Synth(a,a.destination);
    I.master.gain.value=muted?0:.8;aT0=a.currentTime-t;
    if(t<12)scoreIntro(I,aT0,t+.02);
    nextBar=max(0,floor((t-12)/2));syn=I;pump();sched=setInterval(pump,500)})}
function unlock(e){
  if(held){api.start();return}
  if(e&&e.type==='keydown'){const k=(e.key||'').toLowerCase();
    if(unlocked&&k==='m'){api.mute(!muted);return}
    if(unlocked&&k==='r'){api.replay();return}}
  if(unlocked)return;unlocked=true;hint.style.opacity=0;
  startAudio(OPT.restartOnSound&&now()<12)}
const api={render,resize,scene:cv,logo:lv,time:()=>max(0,now()),
  replay(){unlocked=true;hint.style.opacity=0;startAudio(true)},
  held:()=>held,
  start(){if(!held)return;held=false;pT0=performance.now()/1000;startEl.classList.add('gone');
    setTimeout(()=>startEl.remove(),700);api.replay()},
  mute(b){muted=!!b;if(syn)syn.master.gain.setTargetAtTime(muted?0:.8,ac.currentTime,.05)},
  fadeOut(sec){muted=true;if(syn){const g=syn.master.gain,n=ac.currentTime;g.cancelScheduledValues(n);g.setValueAtTime(g.value,n);g.linearRampToValueAtTime(0,n+sec)}},
  renderAudio(dur){const sr=48000,oc=new OfflineAudioContext(2,sr*dur,sr),I=Synth(oc,oc.destination);
    scoreIntro(I,0,0);for(let n=0;12+2*n<dur;n++)scoreBar(I,0,n,0);
    I.master.gain.setValueAtTime(.8,dur-.35);I.master.gain.linearRampToValueAtTime(0,dur-.01);
    return oc.startRendering().then(b=>[b.getChannelData(0),b.getChannelData(1)])}};
window.BagelandIntro=api;
api.ready=loadLogo().then(()=>{
  resize();
  if(window.BAGELAND_CAPTURE)return;
  if(!OPT.hint)hint.style.display='none';
  addEventListener('resize',()=>resize());
  for(const ev of['pointerdown','keydown','touchstart'])addEventListener(ev,unlock,{passive:true});
  const loop=()=>{render(max(0,now()));requestAnimationFrame(loop)};
  pT0=performance.now()/1000;requestAnimationFrame(loop)});
})();
</script>
